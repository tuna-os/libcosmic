name: Pages

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pages:
    runs-on: ubuntu-latest
    # actions-gh-pages pushes the docs to the gh-pages branch.
    permissions:
      contents: write

    steps:
      - name: Checkout sources # zizmor: ignore[artipacked] actions-gh-pages pushes the docs later in this job
        uses: actions/checkout@v6.1.0
        with:
          submodules: recursive
      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: nightly-2026-04-27
          rustflags: ""
      - name: System dependencies
        run: sudo apt-get update; sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Build documentation
        run: |
          RUSTDOCFLAGS="--cfg docsrs" \
          cargo +nightly-2026-04-27 doc --no-deps \
          -p cosmic-client-toolkit \
          -p cosmic-protocols \
          -p libcosmic \
          --verbose --features tokio,winit,wayland,desktop,single-instance,applet,xdg-portal,multi-window
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          force_orphan: true
